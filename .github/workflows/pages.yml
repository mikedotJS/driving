# Publie le jeu sur GitHub Pages à chaque poussée sur main (ou à la demande).
# Préalable, une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Publication sur GitHub Pages

# (Pages n'accepte par défaut que la branche par défaut du dépôt : tant que ce n'est pas main, la branche
# de travail publie aussi.)
on:
  push:
    branches: [main, claude/wonderful-gauss-5q6kz3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publication:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
